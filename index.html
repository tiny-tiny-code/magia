<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un poco de magia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1018;--bg2:#14262e;--ink:#eaf1e6;--mute:#9db3a8;--tag:#e3ecdf;--tag-ink:#23302b;--line:rgba(255,255,255,.14);
--serif:'Young Serif',Georgia,serif;--sans:'Nunito Sans',system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1018}}
:root[data-theme="dark"]{--bg:#0a1018}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#1b3640 0%,transparent 60%),radial-gradient(ellipse at 50% 100%,#10281f 0%,transparent 55%),var(--bg);color:var(--ink);font:400 1rem/1.5 var(--sans)}
#ffs{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.ff{position:absolute;width:4px;height:4px;border-radius:50%;background:#f7f3a8;box-shadow:0 0 8px 2px rgba(247,243,168,.55);opacity:0;animation:dr 9s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translate(0,0);opacity:0}25%{opacity:.9}50%{transform:translate(22px,-34px);opacity:.3}75%{opacity:.9}}
.house{position:relative;max-width:520px;margin:14px auto;padding:42px 14px 26px;text-align:center;border:1px solid var(--line);border-radius:50% 50% 20px 20px/150px 150px 20px 20px;
background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 72px),repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 72px),linear-gradient(180deg,rgba(20,38,46,.75),rgba(10,24,20,.7))}
h1{font:400 2.1rem/1.1 var(--serif);margin:6px 0 4px;letter-spacing:.01em}
#q{font:400 1.15rem/1.3 var(--serif);margin:0;color:var(--ink)}
#hint{margin:4px 0 0;color:var(--mute);font-size:.92rem}
#jar{display:block;width:150px;margin:14px auto 0;filter:drop-shadow(0 0 10px rgba(255,255,255,.12));transition:filter 1.2s ease}
#jar.full{filter:drop-shadow(0 0 24px var(--g,#fff));animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-4px)}}
#liq{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(var(--f,0));transition:transform .9s ease}
#dots{display:flex;gap:8px;justify-content:center;margin:2px 0 14px}
.dot{width:9px;height:9px;border-radius:50%;border:1px solid var(--mute);transition:background .4s}
.dot.on{background:var(--ink);border-color:var(--ink)}
.garden{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.pl{width:calc(25% - 4px);min-width:72px;max-width:112px;background:none;border:0;color:var(--mute);font:600 .8rem var(--sans);padding:2px 0 6px;cursor:pointer;border-radius:12px;-webkit-tap-highlight-color:transparent}
.pl svg{display:block;width:100%;max-height:84px;filter:drop-shadow(0 0 7px var(--c));transition:transform .3s}
.pl:hover svg{transform:translateY(-3px)}
.pl:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pl.pop svg{animation:pop .6s ease}
@keyframes pop{40%{transform:scale(1.18);filter:drop-shadow(0 0 16px var(--c))}}
body.done .garden,body.done #dots{display:none}
.orb{position:fixed;left:0;top:0;width:14px;height:14px;border-radius:50%;z-index:20;pointer-events:none}
.rc{position:relative;text-align:left;max-width:420px;margin:30px auto 0;padding:20px 22px 18px;background:var(--tag);color:var(--tag-ink);border-radius:8px 8px 16px 16px;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:rise .9s ease both}
.rc::before{content:"";position:absolute;top:-24px;left:50%;width:2px;height:24px;background:#9fb3a6}
@keyframes rise{from{opacity:0;transform:translateY(14px) rotate(-1.5deg)}to{opacity:1;transform:none}}
.rc h2{font:400 1.25rem/1.2 var(--serif);margin:0 0 8px}
.rc h3{font:400 1rem/1.2 var(--serif);margin:14px 0 6px}
.rc ul,.rc ol{margin:0;padding-left:1.2rem}
.rc li{margin:0 0 6px;line-height:1.45}
.rc .f{margin:14px 0 2px;font-size:.88rem;color:#4b5d54}
.rc .c{margin:2px 0 0;font:400 1rem/1.3 var(--serif)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="ffs" aria-hidden="true"></div>
<main class="house">
  <h1>Un poco de magia</h1>
  <p id="q">¿Qué necesitas esta semana?</p>
  <p id="hint">Elige tres. Puedes repetir.</p>
  <svg id="jar" viewBox="0 0 120 150" role="img" aria-label="Frasco del hechizo">
    <defs>
      <clipPath id="cp"><path d="M40 34h40v10c16 5 24 16 24 36v44c0 12-8 20-20 20H36c-12 0-20-8-20-20V80c0-20 8-31 24-36z"/></clipPath>
      <linearGradient id="lg" x1="0" y1="1" x2="0" y2="0"></linearGradient>
    </defs>
    <g clip-path="url(#cp)"><rect id="liq" x="16" y="34" width="90" height="112" fill="url(#lg)" opacity=".92"/></g>
    <path d="M40 34h40v10c16 5 24 16 24 36v44c0 12-8 20-20 20H36c-12 0-20-8-20-20V80c0-20 8-31 24-36z" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.5)" stroke-width="2"/>
    <path d="M27 84c0-12 4-20 10-24" stroke="rgba(255,255,255,.55)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="35" y="21" width="50" height="13" rx="3" fill="#8a6b3f"/>
  </svg>
  <div id="dots" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <div class="garden" id="garden"></div>
  <section class="rc" id="rc" hidden aria-live="polite"></section>
</main>
<script>
const E={
Suerte:{c:'#6ee7a0',cosas:[['5 tipos de hojas verdes distintas'],['Una moneda o algo que te traiga suerte y que encuentres en la calle'],['Tu número de la suerte sumado al de alguien (pregúntale su número)'],['Algo con un hoyito por el que puedas mirar a través','hoyito']],rit:[['Mira a través del hoyito y pide tu deseo en voz baja','hoyito'],['Di “hoy me va a ir bien” tocando algo que brille']]},
'Alegría':{c:'#ffd95e',cosas:[['Encontrar cosas amarillas'],['Una florcita de la calle'],['Algo que suene (hojas secas, un cascabel)'],['Una frase de una canción que te gustaba de chica (escúchala)']],rit:[['Baila un minuto'],['Encuentra lo que más alegra tus mañanas y dale un premio simbólico (tipo empleado del mes)']]},
Amor:{c:'#ff8fb8',cosas:[['Un papel con toque de perfume o algo que huela rico'],['Una florcita colorida'],['Algo que te regaló alguien'],['Un papelito con el nombre de alguien que quieres']],rit:[['Escríbete un cumplido'],['Expresa gratitud por algo en voz alta']]},
Calma:{c:'#7cc8ff',cosas:[['Una piedra especial que encuentres (caliéntala en la mano unos minutos)'],['Una pizca de sal (sóplala en el bolsillo)'],['Algo suave que te den ganas de tocar'],['Algo de un color que te dé paz']],rit:[['Mira el cielo y respira profundo 3 veces'],['Mírate a los ojos en el espejo un minuto']]},
Travesura:{c:'#b98cff',cosas:[['Algo que no sea tuyo'],['Algo que no combine con nada de lo que traes'],['Algo que parezca más valioso de lo que es']],rit:[['Rompe una regla chiquitita, o haz algo fuera de tu rutina']]},
Claridad:{c:'#e4edf7',cosas:[['Una piedra bien lisa'],['Algo que refleje (un espejito, una cuchara)'],['Un hilito con un nudo','hilo']],rit:[['Mira lo más lejos posible por 30 segundos'],['Ordena un rinconcito'],['Desata el nudo despacito, cuando sientas que la cabeza se enreda','hilo']]},
'Valentía':{c:'#ff6b5e',cosas:[['Algo rojo'],['Una piedra o algo de un lugar donde pasaste un momento difícil y lo superaste'],['Algo de un lugar donde nunca habías estado']],rit:[['Escoge un camino distinto para ir al trabajo o a la casa'],['Di en voz alta lo que quieres']]}
};
const $=s=>document.querySelector(s),K='umdm1',names=Object.keys(E);
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
let picks=[],busy=false;
function ld(){try{return JSON.parse(localStorage.getItem(K))}catch(e){return null}}
function sv(o){try{localStorage.setItem(K,JSON.stringify(o))}catch(e){}}
if(location.hash==='#reset'){try{localStorage.removeItem(K)}catch(e){}try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
// semana: empieza el domingo (hora local)
function wk(){const d=new Date();return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(1970,0,4))/6048e5)}
function H(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return(h^=h>>>16)>>>0}}
function R(s){let a=H(s)();return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function spell(p,w){
  const s=[...p].sort(),r=R(w+'|'+s.join(',')),n={};
  s.forEach(e=>n[e]=(n[e]||0)+1);
  const es=Object.keys(n),cosas=[];
  es.forEach(e=>shuf(E[e].cosas,r).slice(0,n[e]).forEach(c=>cosas.push(c)));
  const keys=cosas.map(c=>c[1]).filter(Boolean);
  let rits=[];
  es.forEach(e=>E[e].rit.forEach(x=>{if(x[1]&&keys.includes(x[1]))rits.push(x)}));
  rits=rits.slice(0,2);
  if(rits.length<2){
    const pool=[];es.forEach(e=>E[e].rit.forEach(x=>{if(!x[1])pool.push(x)}));
    const sh=shuf(pool,r);while(rits.length<2&&sh.length)rits.push(sh.shift());
  }
  return{cosas,rits};
}
function plant(c,i){
  const n=[5,6,4,7,5,8,6][i],rd=[6.5,5.5,8,5,7,4.5,6][i];let p='';
  for(let k=0;k<n;k++){const a=k/n*6.283;p+=`<circle cx="${(30+Math.cos(a)*9).toFixed(1)}" cy="${(28+Math.sin(a)*9).toFixed(1)}" r="${rd}" fill="${c}" opacity=".88"/>`}
  return `<svg viewBox="0 0 60 84" aria-hidden="true"><path d="M30 82C30 64 27 52 30 36" stroke="#4f9a6b" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="21" cy="62" rx="9" ry="4.5" transform="rotate(-30 21 62)" fill="#3f8a5c"/><ellipse cx="39" cy="54" rx="9" ry="4.5" transform="rotate(30 39 54)" fill="#4f9a6b"/>${p}<circle cx="30" cy="28" r="5" fill="#fff8d8"/></svg>`;
}
function paint(){
  const cs=picks.map(e=>E[e].c);
  const lg=document.getElementById('lg');
  lg.innerHTML=cs.map((c,i)=>`<stop offset="${cs.length>1?i/(cs.length-1):0}" stop-color="${c}"/>`).join('');
  $('#liq').style.setProperty('--f',picks.length/3);
  $('#jar').style.setProperty('--g',cs[Math.floor(cs.length/2)]||'#fff');
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i<picks.length));
}
function fly(btn,c){return new Promise(res=>{
  const a=btn.getBoundingClientRect(),b=$('#jar').getBoundingClientRect(),o=document.createElement('i');
  o.className='orb';o.style.background=c;o.style.boxShadow=`0 0 14px 4px ${c}`;document.body.appendChild(o);
  const x0=a.left+a.width/2-7,y0=a.top+14,x1=b.left+b.width/2-7,y1=b.top+b.height*.35;
  const an=o.animate([{transform:`translate(${x0}px,${y0}px)`},{transform:`translate(${(x0+x1)/2+Math.random()*40-20}px,${Math.min(y0,y1)-30}px)`,offset:.45},{transform:`translate(${x1}px,${y1}px) scale(.4)`,opacity:.9}],{duration:reduce?1:950,easing:'ease-in-out'});
  an.onfinish=()=>{o.remove();res()};
})}
async function pick(e,btn){
  if(busy||picks.length>=3)return;busy=true;
  btn.classList.add('pop');setTimeout(()=>btn.classList.remove('pop'),600);
  await fly(btn,E[e].c);picks.push(e);paint();busy=false;
  if(picks.length===3){sv({w:wk(),p:picks});setTimeout(reveal,reduce?0:1100)}
}
function reveal(){
  const s=spell(picks,wk());
  const L=s.cosas.map(c=>`<li>${cap(c[0])}</li>`).join(''),Rr=s.rits.map(r=>`<li>${r[0]}</li>`).join('');
  $('#rc').innerHTML=`<h2>Receta de la semana</h2><h3>Ingredientes</h3><ul>${L}</ul><h3>Modo de preparación</h3><ol>${Rr}</ol><p class="f">Tus tres: ${[...picks].sort((a,b)=>a.localeCompare(b,'es')).join(', ')}</p><p class="c">Conservar en el bolsillo hasta el domingo.</p>`;
  document.body.classList.add('done');$('#jar').classList.add('full');
  $('#q').textContent='Para esta semana';$('#hint').textContent='Se renueva el domingo.';$('#rc').hidden=false;
}
// jardín
const g=$('#garden');
names.forEach((e,i)=>{
  const b=document.createElement('button');b.className='pl';b.style.setProperty('--c',E[e].c);b.setAttribute('aria-label','Elegir '+e);
  b.innerHTML=plant(E[e].c,i)+e;b.onclick=()=>pick(e,b);g.appendChild(b);
});
// luciérnagas
for(let i=0;i<16;i++){const f=document.createElement('b');f.className='ff';f.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${-Math.random()*9}s;animation-duration:${7+Math.random()*6}s`;$('#ffs').appendChild(f)}
// estado de la semana
const S=ld();
if(S&&S.w===wk()&&Array.isArray(S.p)&&S.p.length===3&&S.p.every(e=>E[e])){
  picks=S.p;setTimeout(()=>{paint();reveal()},60);
}else paint();
</script>
</body>
</html>
